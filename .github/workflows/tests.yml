name: 测试

# 三套离线测试，全部不消耗 API、不需要 API Key、不需要题库
# （题库因版权不进仓库，相关断言在没题库时自动「跳过」而不是失败，见各测试文件顶部）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.10" }   # 最低支持版本
          - { os: ubuntu-latest,  python: "3.13" }
          - { os: windows-latest, python: "3.13" }   # 主要目标平台
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 离线自测（工具链 / 分区 / 报告落盘）
        run: python tests/test_offline.py

      - name: 调参算法（对二阶系统解析解校验）
        run: python tests/test_tuning.py

      - name: 网页端（接口 / 上传调参 / 错误处理 / 路径安全）
        run: python tests/test_web.py

      # 用无头浏览器真跑一遍首页 JS：抓"元素不存在让 init 中断"这类只在前端运行时暴露的 bug
      # （v0.5.0 的 exe 就是栽在这上面）。没有浏览器的环境会自动跳过，不算失败；
      # windows runner 自带 Edge，所以这一步在 CI 里会真的执行。
      - name: 前端运行时（无头浏览器渲染首页）
        run: python tests/test_frontend_runtime.py

      - name: 启动器（端口避让 / 日志兜底 / 窗口能力探测）
        run: python tests/test_launcher.py

      # 追问（多轮对话）与多供应商：用**假 LLM** 离线验证"上下文真的带上了"
      - name: 追问与供应商（离线，假 LLM）
        run: python tests/test_ask.py

      # 知识点映射（「这题要会什么」）：含知识表自身的质量闸门（判据必须可自测）
      - name: 知识点映射（离线）
        run: python tests/test_learning.py

      # 用户经验档位（首次引导）：用假 LLM 抓住 system prompt，证明档位真的改变了输出
      - name: 用户档位/首次引导（离线）
        run: python tests/test_profile.py

      # 串口助手：用假串口后端覆盖粘包/半包/编码回退/滑窗/异常（无需真实硬件）
      - name: 串口助手（离线，假串口）
        run: python tests/test_serial.py

      # 串口助手的网页接口（feed 注入，无需硬件）
      - name: 串口助手接口（离线）
        run: python tests/test_serial_api.py

      # 声明式帧解析（纯计算，不需要硬件）
      - name: 帧解析（离线）
        run: python tests/test_frame.py

      # STM32 串口 ISP（用假 BootLoader，不需要硬件）
      - name: STM32 ISP（离线）
        run: python tests/test_stm32_isp.py
          python tests/test_sweep.py
          python tests/test_report_table.py

      - name: 命令行空跑（不调用模型）
        run: |
          python cli.py --version
          python cli.py --domains
          python cli.py analyze H --dry-run

      # --check 是「环境是否就绪」检查：没有 API Key 时以退出码 2 表示未就绪，这是预期行为。
      # CI 里没有 Key（也不该有），所以这一步不判失败 —— 但要确认它不崩。
      - name: 命令行自检 --check（无 Key 时退出码 2 属预期，不判失败）
        continue-on-error: true
        run: python cli.py --check

  # ★ 独立安装验证：核心只装 pyserial，装完必须能列串口、且不能拖进重依赖
  independent-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 只装核心（应该只拉 pyserial）
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: 核心装完不该有 numpy/fastapi/matplotlib
        run: |
          python - <<'PY'
          import sys
          import contest_workbench.serial_assistant, contest_workbench.frame_parser
          import contest_workbench.stm32_isp, contest_workbench.serial_cli
          heavy = [m for m in ("numpy", "fastapi", "matplotlib", "uvicorn", "yaml")
                   if m in sys.modules]
          print("拖进来的重依赖:", heavy)
          assert not heavy, f"核心安装不该依赖 {heavy}"
          PY
      - name: 命令行入口可用（中文帮助）
        run: |
          diansai-serial --help
          diansai-serial --version
          diansai-serial ports || true        # 无串口时退出码 1，属正常
      - name: 缺 numpy 时给的是人话（不是栈）
        run: |
          printf '0.0,0.0\n0.1,0.5\n' > /tmp/x.csv
          if diansai-serial analyze /tmp/x.csv 2>/tmp/err.txt; then exit 1; fi
          cat /tmp/err.txt
          grep -q "metrics" /tmp/err.txt
      - name: 装 [metrics] 后能算指标
        run: |
          pip install ".[metrics]"
          python -c "import contest_workbench.sweep; print('sweep 可导入')"
