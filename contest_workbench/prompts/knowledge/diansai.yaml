# 电赛知识点映射表（得分点 → 要会什么 → 怎么自学）
#
# ★ 这份表是**确定性数据**：程序按"命中关键词"匹配题面，命中就给。
#   - 不花模型 token、可人工校对、可测试（见 tests/test_learning.py）
#   - 关键词取自本地题库 40 道真题（2021/2023/2024/2025/2026）的实际用词
#   - "核验资源"只写**确定存在**的教材/手册（不写具体网址，避免失效与编造）；
#     搜索入口由代码拼接（B站/必应），不依赖模型生成链接
#
# 维护约定：改完跑 `python tests/test_learning.py`；新增条目要写"掌握判据"，
# 判据必须是**用户能自测的**（"能解释…""能算出…"），不要写"熟悉""了解"。

version: 1
domain: diansai
updated: 2026-10-02

# 通用关键词：任何电赛题面都会出现，几乎不含"这题考什么"的信息。
# 命中它们只按 0.3 计分，避免"报告写作""仪器使用"这类元知识把主题知识顶下去。
# 另：**题名**里出现的词按 3 倍计分（题名是最强信号，见 tools/learning.py）。
通用关键词: [方案, 论证, 测试, 报告, 指标, 评分, 结论, 比较, 选型, 分析, 设计]

items:
  - id: mcu-basics
    知识点: 嵌入式主控基础（STM32 定时器 / PWM / ADC / 中断）
    命中关键词: [STM32, 单片机, 主控, 定时器, PWM, ADC, DMA, 中断, 晶振, 烧录]
    掌握判据:
      - 能说清定时器如何产生指定频率的 PWM（预分频 + 自动重装值怎么算）
      - 能用 ADC + DMA 连续采样并算出一段数据的有效值
      - 能在中断里做一件事而不会把主循环卡住
    搜索词: ["STM32 定时器 PWM 频率 计算 例程", "STM32 ADC DMA 连续采样 有效值"]
    核验资源: [{类型: 手册, 名称: STM32F4xx 中文参考手册 · 定时器/ADC 章节},
               {类型: 教程, 名称: 正点原子《STM32F407 开发指南》对应实验}]

  - id: motor-control
    知识点: 电机/舵机驱动与运动控制
    命中关键词: [电机, 驱动, 小车, 舵机, 步进, 循迹, 调速, 编码器, 轮速, 转向]
    掌握判据:
      - 能选对驱动方案并解释为什么（H 桥 / 驱动模块 / 舵机信号）
      - 能用编码器测速并换算成实际速度（脉冲数 → 转速）
      - 能解释"舵机 50Hz、脉宽 0.5–2.5ms"这类时序要求
    搜索词: ["直流电机 H桥 驱动 原理 选型", "编码器 测速 转速 计算 STM32"]
    核验资源: [{类型: 教材, 名称: 《电机与拖动》相关章节},
               {类型: 手册, 名称: 你所选驱动芯片的数据手册（必读）}]

  - id: control-pid
    知识点: 自动控制 · PID 与闭环整定
    命中关键词: [PID, 闭环, 反馈, 超调, 振荡, 稳定, 平衡, 跟踪, 位置, 速度环, 稳压, 动态]
    掌握判据:
      - 能解释 P / I / D 各自改变什么（不是背口诀）
      - 能看懂阶跃响应的超调量、上升时间、调节时间、稳态误差
      - 能用临界比例度法手算一组初值，再按现象调
    搜索词: ["PID 参数整定 临界比例度法 例题", "阶跃响应 超调量 调节时间 计算"]
    核验资源: [{类型: 教材, 名称: 《自动控制原理》胡寿松 · 时域分析 / 校正章节},
               {类型: 提示, 名称: 本工作台「调参助手」可直接算指标并给调整建议}]

  - id: signal-conditioning
    知识点: 传感器与信号调理（运放 / 滤波 / 采样）
    命中关键词: [传感器, 采集, 放大, 滤波, 调理, 噪声, 运放, 基准, 隔离]
    掌握判据:
      - 能设计一个同相/反相放大电路并算增益
      - 能解释为什么要抗混叠滤波（采样率与信号频率的关系）
      - 能定位"数据在跳"是电源噪声、接地还是代码问题
    搜索词: ["运放 同相放大 反相放大 增益 计算", "抗混叠滤波 采样定理 实际电路"]
    核验资源: [{类型: 教材, 名称: 《模拟电子技术基础》童诗白 · 运放章节}]

  - id: ac-measurement
    知识点: 交流电参数测量（真有效值 / 功率 / 功率因数）
    命中关键词: [电流表, 功率, 有效值, 功率因数, 单相, 三相, 交流, 互感, 电能]
    掌握判据:
      - 能解释真有效值与"整流后取平均"的区别，以及何时会差很多
      - 能算有功功率、功率因数，并说明相位怎么测
      - 能按量程与相位误差要求选出互感器/分流器
    搜索词: ["真有效值 测量 原理 RMS 与 平均值 区别", "功率因数 相位差 测量 方法"]
    核验资源: [{类型: 教材, 名称: 《电子测量技术》或《电路》交流功率章节}]

  - id: lcr-impedance
    知识点: 阻抗 / LCR 测量（电桥、谐振法、时域反射）
    命中关键词: [电感, 电容, 阻抗, 谐振, 电桥, 同轴电缆, 负载检测, 长度, 品质因数]
    掌握判据:
      - 能说出至少两种测电感/电容的方法及各自适用量程
      - 能解释谐振法测 L/C 的原理，并算谐振频率
      - 能画出同轴电缆「长度 → 时延 → 反射」的链路并估算长度
    搜索词: ["电感 电容 测量 谐振法 原理", "时域反射 TDR 电缆 长度 测量"]
    核验资源: [{类型: 教材, 名称: 《电子测量技术》阻抗测量章节}]

  - id: power-electronics
    知识点: 电力电子变换（整流 / 逆变 / 斩波 / SPWM）
    命中关键词: [AC-AC, DC-DC, DC-AC, 逆变, 整流, 变换, 变流器, 斩波, SPWM, 桥, 驱动电路, 变压器]
    掌握判据:
      - 能画出 Buck / Boost / 全桥的基本拓扑并说出各器件作用
      - 能算占空比与输出电压的关系，并解释为什么实际偏低
      - 能解释死区、驱动隔离、续流回路各自为什么必须处理
    搜索词: ["Buck Boost 电路 占空比 计算 原理", "SPWM 逆变 原理 死区 时间"]
    核验资源: [{类型: 教材, 名称: 《电力电子技术》王兆安 · 各变换电路章节}]

  - id: paralleling-harmonics
    知识点: 并联均流 / 谐波与有源滤波
    命中关键词: [并联, 均流, 环流, 谐波, 有源滤波, 功率因数校正, 回馈, 同步]
    掌握判据:
      - 能解释两台电源并联为什么会不均流（内阻/基准差异）
      - 能说出至少两种均流做法（下垂控制 / 主从 / 均流母线）并说明取舍
      - 能解释谐波从哪来、有源滤波大致怎么做
    搜索词: ["并联 均流 下垂控制 原理", "有源电力滤波 APF 原理 谐波检测"]
    核验资源: [{类型: 教材, 名称: 《电力电子技术》并联与谐波章节}]

  - id: wireless-comm
    知识点: 无线通信模块应用（蓝牙 / 433M / LoRa / 数传）
    命中关键词: [无线, 通信, 蓝牙, 433, LoRa, 数传, 遥控, 读表, 组网, 以太网, 双绞线]
    掌握判据:
      - 能选对模块并解释取舍（距离 / 速率 / 功耗 / 干扰）
      - 能解释为什么要加校验、重传、超时（丢包是常态）
      - 能设计一个"发—收—确认"的最小协议
    搜索词: ["LoRa 与 蓝牙 433 对比 选型 距离", "串口 无线模块 通信 协议 校验 重传"]
    核验资源: [{类型: 手册, 名称: 所选模块的 AT 指令手册（必读）}]

  - id: modulation
    知识点: 信号调制 / 解调与调制识别
    命中关键词: [调制, 解调, 识别, 接收机, AM, FM, ASK, FSK, PSK, 载波, 包络]
    掌握判据:
      - 能画出 AM/FM/ASK/FSK 的波形差别并说出判据特征
      - 能解释包络检波为什么对 AM 有效、对 FM 无效
      - 能说出怎么用软件（IQ 数据 / 频谱）而不是纯模拟电路做识别
    搜索词: ["AM FM ASK FSK 调制 识别 特征 区别", "包络检波 原理 电路"]
    核验资源: [{类型: 教材, 名称: 《通信原理》调制解调章节}]

  - id: spectrum-estimation
    知识点: 频谱分析与参数估计（FFT / 失真度）
    命中关键词: [周期信号, 频谱, FFT, 失真度, 谐波, 频率, 相位, 幅度, 李萨如, 分析]
    掌握判据:
      - 能解释采样率、点数、频率分辨率三者的关系
      - 能用 FFT 找出基波与各次谐波，并算失真度
      - 能说出泄漏与加窗是怎么回事（为什么频率对不上）
    搜索词: ["FFT 频率分辨率 加窗 泄漏 原理", "失真度 THD 计算 方法"]
    核验资源: [{类型: 教材, 名称: 《数字信号处理》程佩青 或 《信号与系统》郑君里}]

  - id: signal-separation
    知识点: 信号分离与干扰抑制
    命中关键词: [分离, 混合, 盲源, 干扰, 屏蔽, 滤波, 陷波, 抵消, 提取]
    掌握判据:
      - 能按"频域可分 / 时域可分 / 空间可分"给分离问题分类
      - 能设计一个陷波或带通滤波并说出参数怎么定
      - 能说出屏蔽、接地、共地干扰的基本处理顺序
    搜索词: ["盲源分离 原理 与 滤波 区别", "陷波器 设计 参数 计算"]
    核验资源: [{类型: 教材, 名称: 《数字信号处理》滤波器设计章节}]

  - id: vision
    知识点: 机器视觉与视觉测量（标定 / 测距 / 跟踪）
    命中关键词: [视觉, 摄像头, 相机, 图像, 目标, 识别, 测量, 标定, 追踪, 瞄准, 盘点]
    掌握判据:
      - 能解释像素坐标 → 实际尺寸需要哪些参数（焦距/距离/标定）
      - 能说清阈值、轮廓、颜色空间三种基础手段各自适用什么场景
      - 能说出光照变化为什么会让昨天能跑的代码今天失效
    搜索词: ["单目 测距 像素 实际尺寸 换算 标定", "OpenCV 轮廓 检测 阈值 参数 调"]
    核验资源: [{类型: 文档, 名称: OpenCV 官方文档（Python 教程）}]

  - id: uav
    知识点: 无人机 / 飞行器基础与协同
    命中关键词: [无人机, 飞行器, 陆空, 空地, 协同, 植保, 飞控, 图传, 航点]
    掌握判据:
      - 能区分飞控负责什么、你的上位机负责什么（别重造飞控）
      - 能说出室内定位为什么难（无 GPS → 光流 / UWB / 视觉）
      - 能设计"车—机"协同的最小通信与时间同步方案
    搜索词: ["无人机 飞控 上位机 通信 MAVLink 入门", "室内 定位 光流 UWB 视觉 对比"]
    核验资源: [{类型: 文档, 名称: 你所用飞控的官方开发文档}]

  - id: localization
    知识点: 定位与测距（声 / 超声 / TDOA / 激光）
    命中关键词: [定位, 测距, 声传播, 超声, 激光, 红外, 到达时间, 三角]
    掌握判据:
      - 能解释为什么声定位精度受温度与采样率限制
      - 能算 TDOA 定位的基本方程（双曲线交点）
      - 能说出多路径反射会怎么毁掉测量
    搜索词: ["TDOA 定位 原理 双曲线 求解", "超声波 测距 精度 温度 补偿"]
    核验资源: [{类型: 教材, 名称: 《传感器原理》或信号检测类教材}]

  - id: power-supply
    知识点: 供电与器件选型（LDO / DCDC / 纹波 / 去耦）
    命中关键词: [电源, LDO, DCDC, 稳压, 纹波, 去耦, 供电, 电池, 效率, 功耗]
    掌握判据:
      - 能按电流与压差选 LDO 还是 DCDC，并解释发热怎么估
      - 能说出每个芯片电源脚要放什么电容、为什么
      - 能定位"一上电就复位"是电流不够还是纹波太大
    搜索词: ["LDO 与 DCDC 选型 区别 发热 计算", "电源 纹波 测量 去耦 电容 布局"]
    核验资源: [{类型: 教材, 名称: 《模拟电子技术基础》稳压电源章节}]

  - id: measurement-error
    知识点: 测量误差与数据处理
    命中关键词: [误差, 精度, 分辨率, 标定, 校准, 重复性, 数据处理, 拟合]
    掌握判据:
      - 能区分系统误差与随机误差，并说出各自处理办法
      - 能给出测量结果的误差范围（不是只报一个数）
      - 会用最小二乘做一次线性标定
    搜索词: ["系统误差 随机误差 区别 处理 方法", "最小二乘 线性 拟合 标定 例子"]
    核验资源: [{类型: 教材, 名称: 《电子测量技术》误差分析章节}]

  - id: instruments
    知识点: 仪器使用（示波器 / 信号源 / 万用表 / 频谱）
    命中关键词: [示波器, 信号源, 万用表, 频谱仪, 探头, 带宽, 触发, 测量仪器]
    掌握判据:
      - 能说出探头 1X/10X 对带宽与负载的影响
      - 能用示波器正确测上升时间与纹波（含接地弹簧用法）
      - 能说出信号源输出阻抗与负载匹配的关系
    搜索词: ["示波器 探头 10X 1X 区别 带宽", "示波器 测 纹波 正确 接法 接地弹簧"]
    核验资源: [{类型: 文档, 名称: 实验室示波器型号的用户手册}]

  - id: host-software
    知识点: 上位机与数据处理（Python / 串口）
    命中关键词: [上位机, 串口, 数据, 显示, 曲线, 通信, 上位, 记录]
    掌握判据:
      - 能用 Python + pyserial 读串口并实时画曲线
      - 能解释为什么要按行、带时间戳、可断点续存
      - 能把采集数据直接算成指标（不用手工抄数）
    搜索词: ["Python pyserial 实时 曲线 示例", "串口 数据 采集 时间戳 存储 格式"]
    核验资源: [{类型: 文档, 名称: pyserial 官方文档},
               {类型: 提示, 名称: 本工作台正在做「串口调试助手」，可直接收数据进调参助手}]

  - id: report-scoring
    知识点: 报告写作与评分点（方案论证 / 测试方法 / 误差分析）
    命中关键词: [方案, 论证, 测试, 报告, 指标, 评分, 结论, 比较, 选型]
    掌握判据:
      - 能写清"为什么选这个方案"（对比 + 判据，不是"我们选了 XX"）
      - 能设计出可复现的测试步骤（别人照着做能得到同样结果）
      - 能说出误差分析要落在具体来源上（不是写"存在一定误差"）
    搜索词: ["电子设计竞赛 报告 评分 标准 要点", "测试方案 怎么写 可复现 步骤"]
    核验资源: [{类型: 文档, 名称: 电赛官方《设计报告》格式要求（以当年通知为准）}]
